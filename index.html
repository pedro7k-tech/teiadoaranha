  <body class="bg-[#0A0A0E] text-white font-body selection:bg-hero-red selection:text-white antialiased overflow-x-hidden">
    <div id="root"></div>
    <script>
      // Se aberto diretamente com duplo clique (file://), redireciona automaticamente para o site pronto em dist/index.html
      // A verificação extra garante que não entraremos em loop caso já estejamos no arquivo dist/index.html
      if (window.location.protocol === 'file:' && !window.location.pathname.endsWith('/dist/index.html')) {
        window.location.replace('./dist/index.html');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
